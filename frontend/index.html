<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تحميل الفيديوهات الشامل</title>
    <link rel="stylesheet" href="/src/style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>تحميل الفيديوهات الشامل</h1>
            <p>قم بتحميل الفيديوهات من أي منصة بكل سهولة.</p>
        </header>

        <main>
            <div class="input-group">
                <input type="text" id="videoUrl" placeholder="الصق رابط الفيديو هنا...">
                <button id="fetchBtn">استخراج</button>
            </div>

            <div class="cookie-group">
                <label for="cookieFile" class="cookie-label">
                    <span>(اختياري) رفع ملف cookies.txt للمنصات التي تتطلب تسجيل الدخول:</span>
                    <input type="file" id="cookieFile" accept=".txt">
                </label>
            </div>

            <div id="loading" class="hidden">
                <div class="spinner"></div>
                <p>جاري استخراج معلومات الفيديو...</p>
            </div>

            <div id="error" class="error-msg hidden"></div>

            <div id="result" class="result-container hidden">
                <div class="video-info">
                    <img id="videoThumb" src="" alt="Thumbnail" class="thumbnail hidden">
                    <h2 id="videoTitle"></h2>
                    <p id="videoUploader" class="uploader"></p>
                </div>
                
                <h3>اختر صيغة التحميل:</h3>
                <div id="formatsList" class="formats-list"></div>
            </div>
        </main>

        <footer>
            <p>نحن لا نخزن ملفات الكوكيز أو الفيديوهات، كل شيء يعمل مؤقتاً.</p>
        </footer>
    </div>
    <script type="module" src="/src/main.js"></script>
</body>
</html>
