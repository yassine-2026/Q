<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تحميل الفيديوهات الشامل</title>
    <link rel="stylesheet" href="/src/style.css">
    <style>
        .error-msg { display: none; }
    </style>
</head>
<body>
    <div class="page-wrapper">
        <aside class="ad-side desktop-only">
            <!-- Left Banner 160x300 -->
            <script>
              atOptions = {
                'key' : 'ae02bca2fe89559fcd933a2e568d0954',
                'format' : 'iframe',
                'height' : 300,
                'width' : 160,
                'params' : {}
              };
            </script>
            <script src="https://www.highperformanceformat.com/ae02bca2fe89559fcd933a2e568d0954/invoke.js"></script>
        </aside>

        <div class="container">
            <header>
                <h1>تحميل الفيديوهات الشامل</h1>
                <p>قم بتحميل الفيديوهات من أي منصة بكل سهولة.</p>
            </header>

            <main>
                <form id="download-form">
                    <div class="input-group">
                        <input type="url" id="url-input" placeholder="الصق رابط الفيديو هنا..." required>
                        <button type="submit" id="fetchBtn">استخراج</button>
                    </div>

                    <div class="cookie-group">
                        <label for="cookies-file" class="cookie-label">
                            <span>(اختياري) رفع ملف cookies.txt للمنصات التي تتطلب تسجيل الدخول:</span>
                            <input type="file" id="cookies-file" accept=".txt">
                        </label>
                    </div>
                </form>

                <div class="ad-center">
                    <!-- Center Banner 300x250 under input -->
                    <script>
                      atOptions = {
                        'key' : 'dcdbd83f1e6eee5292fd37f7cd457b27',
                        'format' : 'iframe',
                        'height' : 250,
                        'width' : 300,
                        'params' : {}
                      };
                    </script>
                    <script src="https://www.highperformanceformat.com/dcdbd83f1e6eee5292fd37f7cd457b27/invoke.js"></script>
                </div>

                <div id="error" class="error-msg"></div>
                <div id="result" class="result-container" style="display:none;"></div>

                <div class="ad-center" style="margin-top: 2rem;">
                    <!-- Center Banner 300x250 under results -->
                    <script>
                      atOptions = {
                        'key' : 'dcdbd83f1e6eee5292fd37f7cd457b27',
                        'format' : 'iframe',
                        'height' : 250,
                        'width' : 300,
                        'params' : {}
                      };
                    </script>
                    <script src="https://www.highperformanceformat.com/dcdbd83f1e6eee5292fd37f7cd457b27/invoke.js"></script>
                </div>
            </main>

            <footer>
                <p>نحن لا نخزن ملفات الكوكيز أو الفيديوهات، كل شيء يعمل مؤقتاً.</p>
            </footer>
        </div>

        <aside class="ad-side desktop-only">
            <!-- Right Banner 160x300 -->
            <script>
              atOptions = {
                'key' : 'ae02bca2fe89559fcd933a2e568d0954',
                'format' : 'iframe',
                'height' : 300,
                'width' : 160,
                'params' : {}
              };
            </script>
            <script src="https://www.highperformanceformat.com/ae02bca2fe89559fcd933a2e568d0954/invoke.js"></script>
        </aside>
    </div>
    <script type="module" src="/src/main.js"></script>
</body>
</html>
