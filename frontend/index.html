<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="monetag" content="ee96248997a1750eab7cac479d409125">
    <title>تحميل الفيديوهات الشامل</title>
    <link rel="stylesheet" href="/src/style.css">
    <style>
        .error-msg { display: none; }
    </style>
    <script async="async" data-cfasync="false" src="https://pl30100190.effectivecpmnetwork.com/eb0e47ce334ef8f3c2ef62738a30c4c9/invoke.js"></script>
    <div id="container-eb0e47ce334ef8f3c2ef62738a30c4c9"></div>
</head>
<body>
    <div class="container">
        <header>
            <h1>تحميل الفيديوهات الشامل</h1>
            <p>قم بتحميل الفيديوهات من أي منصة بكل سهولة.</p>
        </header>

        <main>
            <form id="download-form">
                <div class="input-group">
                    <input type="url" id="url-input" placeholder="الصق رابط الفيديو هنا..." required>
                    <button type="submit" id="fetchBtn">استخراج</button>
                </div>

                <div class="cookie-group">
                    <label for="cookies-file" class="cookie-label">
                        <span>(اختياري) رفع ملف cookies.txt للمنصات التي تتطلب تسجيل الدخول:</span>
                        <input type="file" id="cookies-file" accept=".txt">
                    </label>
                </div>
            </form>

            <div id="error" class="error-msg"></div>
            <div id="result" class="result-container" style="display:none;"></div>
        </main>

        <footer>
            <p>نحن لا نخزن ملفات الكوكيز أو الفيديوهات، كل شيء يعمل مؤقتاً.</p>
        </footer>
    </div>
    <script type="module" src="/src/main.js"></script>
</body>
</html>
